name: GitHub Actions AroundYou
on:
  push:
    branches:
      - main
jobs:
  # nome job 
  test-backend: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install Backend dependencies
        working-directory: ./Backend
        run: npm install

      - name: Run Backend tests
        working-directory: ./Backend
        run: npm test
  
  deploy-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install Backend dependencies
        working-directory: ./Backend
        run: npm install

      - name: Deploy Backend to production
        working-directory: ./Backend
        run: npm run deploy