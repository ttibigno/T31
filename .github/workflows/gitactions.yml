name: GitHub Actions AroundYou

on:
  push:
    branches:
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install Backend dependencies
        working-directory: ./Backend
        run: npm install

      - name: Run Backend tests
        working-directory: ./Backend
        run: npm test

  deploy-backend:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Trigger Render backend deploy
        run: |
          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_BACKEND_KEY }} \
            -H 'Authorization: Bearer ${{ secrets.RENDER_API_KEY }}' \
            -H 'Content-Type: application/json'

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
      - name: Trigger Render frontend deploy
        run: |
          curl -X POST https://api.render.com/deploy/srv-${{ secrets.RENDER_FRONTEND_KEY }} \
            -H 'Authorization: Bearer ${{ secrets.RENDER_API_KEY }}' \
            -H 'Content-Type: application/json'
